services:
  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@postgres:5432/assistant
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "./wait-for-postgres.sh && alembic upgrade head"
    restart: "no"

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@postgres:5432/assistant
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "./wait-for-postgres.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    command: >
      sh -c "./wait-for-postgres.sh && celery -A app.workers.celery_app.celery_app worker --loglevel=INFO"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@postgres:5432/assistant
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: >
      sh -c "./wait-for-postgres.sh && celery -A app.workers.celery_app.celery_app beat --loglevel=INFO"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:assistant@postgres:5432/assistant
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
